plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// The patch number is the commit count (buildSrc ModVersion), so each update installs a higher
// version than the one before it. Without git, the build warns and uses patch 0.
def commitCount = providers.exec {
	commandLine 'git', 'rev-list', '--count', 'HEAD'
	ignoreExitValue = true
}
version = ModVersion.of(project.mod_version, commitCount.result.get().exitValue == 0 ? commitCount.standardOutput.asText.get() : null)
	.orElseGet {
		logger.warn("No git commit count; the version is ${project.mod_version}.0")
		"${project.mod_version}.0"
	}

repositories {
	// For test-only dependencies. Loom supplies the Minecraft and Fabric repositories itself.
	mavenCentral()

	// ModMenu, which is only needed to compile the entrypoint that puts the
	// screen behind its Settings button.
	maven { url = "https://maven.terraformersmc.com/releases" }
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// ModMenu is compile-only on purpose. It is one entrypoint class, and Fabric
	// never loads an entrypoint whose owning mod is absent, so the mod runs fine
	// without ModMenu installed - you just reach the screen with /cherry.
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Tests run plain JUnit against code that needs no running game.
	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()

	// Minecraft's log4j config on the test classpath writes logs/latest.log in the working
	// directory; keep it under build/ instead of the project root.
	def runDir = layout.buildDirectory.dir("test-run").get().asFile
	workingDir = runDir
	doFirst { runDir.mkdirs() }
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Pin the JDK Gradle compiles with, so the build does not depend on whatever
	// `java` happens to be on PATH. MC 26.2 requires 25.
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

/**
 * Copies the built mod jar into the real Minecraft mods folder and the Prism Launcher test
 * instance, because those folders are how this mod is tested - a dev client has no Hypixel to
 * connect to. `build` finalizes with it, so a fresh jar is in place without a second command.
 * `./gradlew build -x installMod` verifies without touching either folder.
 *
 * <p>A mods folder that does not exist is skipped, which is what keeps it off any machine that is
 * not the user's Mac. The jar is named `cherrypicking-<version>.jar`; any other jar in the folder
 * with this mod's id, such as the one from before a version bump, is deleted (buildSrc
 * `ModInstall`), so each folder holds one copy.
 */
tasks.register("installMod") {
	description = "Copies the built mod jar into the Minecraft and Prism Launcher mods folders"
	group = "build"

	def home = System.getProperty('user.home')
	def modsDirs = [
		file("${home}/Library/Application Support/minecraft/mods"),
		file("${home}/Library/Application Support/PrismLauncher/instances/skybllock test/minecraft/mods"),
	]
	def jarTask = tasks.named("jar")
	def jarName = "${project.name}-${project.version}.jar"

	// A jar whose tests fail never reaches the game, however the task is started.
	dependsOn(tasks.named("check"))
	dependsOn(jarTask)

	doLast {
		def builtJar = jarTask.get().archiveFile.get().asFile
		modsDirs.each { modsDir ->
			if (!modsDir.isDirectory()) {
				logger.lifecycle("installMod: no mods folder at ${modsDir}, skipping")
				return
			}
			def removed = ModInstall.install(builtJar.toPath(), modsDir.toPath(), jarName)
			logger.lifecycle("installMod: installed ${jarName} into ${modsDir}")
			removed.each { logger.lifecycle("installMod: removed the older ${it} from ${modsDir}") }
		}
	}
}

tasks.named("build") {
	finalizedBy("installMod")
}
